[tool.poetry]
name = "manv"
version = "0.1.0"
description = "manv language toolchain MVP"
authors = ["r0d <ramsy0dev@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
prompt-toolkit = "^3.0.52"
pygls = "^1.3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"

[tool.poetry.scripts]
manv = "manv.cli:main"

[tool.pytest.ini_options]
markers = [
    "stdlib: needs the standard library, which is parked until the interpreter works (skipped unless --run-stdlib)",
    "needs_clang: needs an LLVM toolchain (clang on PATH); skipped when it is missing",
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
